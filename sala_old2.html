<style>
  :root { --navy:#263860; --sky:#29ABE2; --skyd:#1A7DB3; --tint:#EAF5FC; --white:#fff; }

  html, body { width:100%; height:100%; background:var(--navy); overflow:hidden; font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
  body.hidecursor { cursor:none; }
  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1s ease; }
  .slide.on { opacity:1; }
  .navy { background:var(--navy); color:#fff; }
  .white { background:#fff; color:var(--navy); }
  .abs { position:absolute; }
  .logo { position:absolute; left:96px; top:58px; width:307px; }
  .kicker { position:absolute; left:96px; top:190px; font-size:29px; font-weight:700; letter-spacing:7px; text-transform:uppercase; }
  .navy .kicker { color:var(--sky); } .white .kicker { color:var(--skyd); }
  .title { position:absolute; left:96px; top:232px; height:100px; display:flex; align-items:center; font-size:64px; font-weight:700; white-space:nowrap; }
  .content { position:absolute; left:96px; right:96px; top:370px; bottom:110px; }
  .ico { display:inline-flex; align-items:center; justify-content:center; border-radius:50%; flex:none; }
  .ico svg { width:48%; height:48%; }
  .card { border-radius:24px; }
  .tint { background:var(--tint); }
  .glass { background:rgba(255,255,255,.1); }

  /* calendario */
  .cal { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:34px; top:360px; bottom:125px; }
  .tile { position:relative; padding:43px; display:flex; flex-direction:column; }
  .tile .spec { font-size:29px; font-weight:700; color:var(--skyd); letter-spacing:3px; text-transform:uppercase; padding-right:90px; min-height:58px; display:flex; align-items:center; line-height:1.1; }
  .tile .spec.long { font-size:25px; letter-spacing:1px; }
  .tile .doc { font-size:36px; font-weight:700; margin-top:18px; }
  .tile .dates { font-size:56px; font-weight:700; margin-top:auto; line-height:1.05; }
  .tile .ico { position:absolute; right:43px; top:35px; width:77px; height:77px; background:#fff; color:var(--sky); }
  .pill { position:absolute; right:96px; top:72px; width:384px; height:77px; border-radius:40px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; letter-spacing:4px; }
  .foot { position:absolute; left:96px; bottom:40px; height:53px; display:flex; align-items:center; gap:16px; font-size:32px; color:var(--navy); }
  .foot svg { width:40px; height:40px; color:var(--sky); }

  /* calendario decorativo */
  .dots { position:absolute; display:grid; grid-template-columns:repeat(7,82px); gap:29px; }
  .dots i { width:82px; height:82px; border-radius:15px; background:rgba(255,255,255,.12); }
  .dots i.on { background:var(--sky); }

  .chip { display:inline-flex; align-items:center; height:86px; padding:0 48px; border-radius:43px; background:var(--sky); color:#fff; font-size:33px; font-weight:700; margin-right:29px; }
  ul.list { list-style:none; font-size:35px; line-height:1.25; }
  ul.list li { padding-left:40px; position:relative; margin-bottom:22px; }
  ul.list li::before { content:""; position:absolute; left:4px; top:16px; width:12px; height:12px; border-radius:50%; background:var(--sky); }

  /* pannello modifica */
  #help { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:rgba(0,0,0,.65); color:#fff; font:15px Arial; padding:10px 18px; border-radius:20px; opacity:0; transition:opacity .4s; pointer-events:none; z-index:5; }
  #help.show { opacity:1; }
  #ed { position:fixed; top:0; right:0; bottom:0; width:min(760px,100%); background:#fff; color:#1d2b4a; font:15px Arial; z-index:10; box-shadow:-10px 0 40px rgba(0,0,0,.35); display:none; flex-direction:column; }
  #ed.open { display:flex; }
  #ed header { padding:18px 22px; border-bottom:1px solid #dfe6ef; display:flex; align-items:center; gap:12px; }
  #ed header h2 { font-size:20px; flex:1; }
  #ed .body { padding:18px 22px; overflow:auto; flex:1; }
  #ed h3 { font-size:13px; letter-spacing:2px; color:var(--skyd); margin:20px 0 10px; text-transform:uppercase; }
  #ed label { display:block; font-size:12px; color:#5b6b85; margin-bottom:4px; }
  #ed input[type=text], #ed input[type=number] { width:100%; padding:9px 10px; border:1px solid #c9d4e3; border-radius:8px; font:15px Arial; color:#1d2b4a; }
  #ed .row { display:grid; gap:8px; align-items:center; margin-bottom:8px; }
  #ed .r-spec { grid-template-columns: 1.1fr 1.3fr 1.2fr 34px 34px 34px; }
  #ed .r-or { grid-template-columns: 1fr 1.4fr 34px; }
  #ed .r2 { grid-template-columns: 1fr 1fr; }
  #ed button { font:600 14px Arial; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; background:#e8eef6; color:#1d2b4a; }
  #ed button.pri { background:var(--navy); color:#fff; }
  #ed button.sm { padding:0; width:34px; height:36px; }
  #ed footer { padding:14px 22px; border-top:1px solid #dfe6ef; display:flex; gap:10px; flex-wrap:wrap; }
  #ed .hint { font-size:13px; color:#5b6b85; margin-top:6px; }
  #ed .checks { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; }
  #ed .checks label { font-size:14px; color:#1d2b4a; display:flex; gap:8px; align-items:center; margin:0; }
  #ed .msg { color:#1a7d3a; font-weight:700; align-self:center; }
</style>

if (!ONLINE) { try { const s = localStorage.getItem(KEY); if (s) D = JSON.parse(s); } catch (e) {} }
async function pullData(first) {
  if (!ONLINE) return;
  try {
    const r = await fetch(JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const txt = await r.text();
    if (txt === lastJSON) return;
    const nd = Object.assign(JSON.parse(JSON.stringify(FILE_DATI)), JSON.parse(txt));
    lastJSON = txt;
    if (ed.classList.contains('open')) return;   // non interrompere chi sta modificando
    D = nd; render();
  } catch (e) { console.warn('sala-dati.json non leggibile:', e); }
}

      <div class="content" style="display:grid;grid-template-columns:710px 576px 1fr;gap:38px">
        <div class="card tint" style="padding:48px 53px">
          <div style="display:flex;align-items:center;gap:26px;margin-bottom:38px">${ico('clock', 96, 'var(--navy)', '#fff')}<div style="font-size:43px;font-weight:700">Orari</div></div>
          ${(D.orari || []).map(o => `<div style="margin-bottom:30px"><div style="font-size:29px;font-weight:700;color:var(--skyd)">${esc(o.giorni)}</div><div style="font-size:43px;font-weight:700;margin-top:4px">${esc(o.ore)}</div></div>`).join('')}
        </div>
        <div class="card" style="background:var(--navy);color:#fff;padding:43px;display:flex;flex-direction:column;justify-content:space-between">
          ${[['phone', 'Telefono', D.telefono, 45], ['wa', 'WhatsApp', D.whatsapp, 45], ['mail', 'Email', D.email, 22], ['pin', 'Dove siamo', D.indirizzo, 25]].map(([i, l, v, fs]) => `
          <div style="display:flex;align-items:center;gap:24px">${ico(i, 86, 'var(--sky)', '#fff')}<div style="min-width:0"><div style="font-size:22px;font-weight:700;letter-spacing:4px;color:var(--sky);text-transform:uppercase">${l}</div><div style="font-size:${fs}px;font-weight:700;margin-top:4px;line-height:1.15">${esc(v)}</div></div></div>`).join('')}
        </div>
        <div class="card tint" style="padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px">
          <img src="${QR}" style="width:316px;height:316px;border-radius:12px" alt="QR WhatsApp">
          <div style="font-size:33px;font-weight:700;text-align:center;line-height:1.2">Inquadra e scrivici<br>su WhatsApp</div></div>
      </div>` });

  if (on('servizi')) out.push({ s: sec, cls: 'navy', html: `
      ${head(true, 'Buono a sapersi', 'Pensiamo noi a tutto il resto')}
      <div class="content" style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:34px 38px">
        ${[['file', 'Referti in giornata', 'per la maggior parte degli esami diagnostici'], ['shield', 'Convenzioni', 'con fondi sanitari integrativi e assicurazioni private'],
           ['access', 'Struttura accessibile', 'ingresso senza barriere, ascensore e servizi attrezzati'], ['card', 'Pagamenti', 'contanti, bancomat e carte di credito']].map(([i, t, d]) => `
        <div class="card glass" style="padding:0 48px;display:flex;align-items:center;gap:43px">${ico(i, 125, 'var(--sky)', '#fff')}<div><div style="font-size:43px;font-weight:700">${t}</div><div style="font-size:31px;opacity:.85;margin-top:10px;line-height:1.25">${d}</div></div></div>`).join('')}
      </div>` });
  return out;
}

// ---------- player ----------
const stage = document.getElementById('stage');
let slides = [], idx = 0, timer = null, paused = false;
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`; stage.style.transformOrigin = 'center';
}
function render() {
  slides = buildSlides();
  stage.innerHTML = slides.map(x => `<section class="slide ${x.cls}">${x.html}</section>`).join('');
  idx = 0; show(0);
}
function show(i) {
  const els = stage.children; if (!els.length) return;
  idx = (i + els.length) % els.length;
  [...els].forEach((e, k) => e.classList.toggle('on', k === idx));
  clearTimeout(timer);
  if (!paused) timer = setTimeout(() => show(idx + 1), slides[idx].s * 1000);
}
addEventListener('resize', fit);

// ---------- tastiera / aiuto ----------
const help = document.getElementById('help'); let ht;
addEventListener('mousemove', () => {
  document.body.classList.remove('hidecursor'); help.classList.add('show');
  clearTimeout(ht); ht = setTimeout(() => { help.classList.remove('show'); if (!ed.classList.contains('open')) document.body.classList.add('hidecursor'); }, 2500);
});
addEventListener('keydown', e => {
  if (ed.classList.contains('open')) { if (e.key === 'Escape') closeEd(); return; }
  const k = e.key.toLowerCase();
  if (k === 'e') openEd();
  else if (k === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  else if (e.key === 'ArrowRight') show(idx + 1);
  else if (e.key === 'ArrowLeft') show(idx - 1);
  else if (e.key === ' ') { paused = !paused; show(idx); }
});

// ---------- pannello di modifica ----------
const ed = document.getElementById('ed'), edb = document.getElementById('ed-body'), msg = document.getElementById('ed-msg');
let W = null;
const NOMI = { benvenuto: 'Benvenuto', mese: 'Mese', calendario: 'Calendario specialisti', diagnostica: 'Diagnostica', ecografie: 'Ecografie', radiologia_moc: 'Radiologia e MOC', pressione: 'Prevenzione: pressione', ossa: 'Prevenzione: ossa', nei: 'Prevenzione: nei', orari: 'Orari e prenotazioni', servizi: 'Buono a sapersi' };
function inp(path, val, type = 'text') { return `<input type="${type}" data-p="${path}" value="${esc(val)}">`; }
function drawEd() {
  edb.innerHTML = `
    <h3>Mese</h3>
    <div class="row r2"><div><label>Mese</label>${inp('mese', W.mese)}</div><div><label>Anno</label>${inp('anno', W.anno)}</div></div>
    <h3>Specialisti (${W.specialisti.length}) · 6 per schermata</h3>
    <div class="row r-spec"><label>Specialità</label><label>Medico</label><label>Date (separate da " · ")</label><span></span><span></span><span></span></div>
    ${W.specialisti.map((s, i) => `<div class="row r-spec">${inp(`specialisti.${i}.specialita`, s.specialita)}${inp(`specialisti.${i}.medico`, s.medico)}${inp(`specialisti.${i}.date`, s.date)}
      <button class="sm" data-a="up" data-i="${i}" title="Sposta su">↑</button><button class="sm" data-a="down" data-i="${i}" title="Sposta giù">↓</button><button class="sm" data-a="del" data-i="${i}" title="Elimina">✕</button></div>`).join('')}
    <button data-a="add">+ Aggiungi specialista</button>
    <div class="hint">Suggerimento: per le date usa il punto centrale " · " (copialo da qui: · ). Max 5 date per una riga.</div>
    <h3>Orari</h3>
    ${W.orari.map((o, i) => `<div class="row r-or">${inp(`orari.${i}.giorni`, o.giorni)}${inp(`orari.${i}.ore`, o.ore)}<button class="sm" data-a="delor" data-i="${i}">✕</button></div>`).join('')}
    <button data-a="addor">+ Aggiungi riga orario</button>
    <h3>Contatti</h3>
    <div class="row r2"><div><label>Telefono</label>${inp('telefono', W.telefono)}</div><div><label>WhatsApp</label>${inp('whatsapp', W.whatsapp)}</div></div>
    <div class="row r2"><div><label>Email</label>${inp('email', W.email)}</div><div><label>Indirizzo</label>${inp('indirizzo', W.indirizzo)}</div></div>
    <h3>Tempi</h3>
    <div class="row r2"><div><label>Secondi per schermata calendario</label>${inp('secondi_calendario', W.secondi_calendario, 'number')}</div><div><label>Secondi per le altre schermate</label>${inp('secondi_altre_slide', W.secondi_altre_slide, 'number')}</div></div>
    <h3>Schermate attive</h3>
    <div class="checks">${Object.keys(NOMI).map(k => `<label><input type="checkbox" data-c="${k}" ${W.slide_attive?.[k] !== false ? 'checked' : ''}> ${NOMI[k]}</label>`).join('')}</div>`;
}
function readEd() {
  edb.querySelectorAll('input[data-p]').forEach(el => {
    const p = el.dataset.p.split('.'); let o = W;
    for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
    o[p.at(-1)] = el.type === 'number' ? Math.max(3, +el.value || 10) : el.value;
  });
  W.slide_attive = W.slide_attive || {};
  edb.querySelectorAll('input[data-c]').forEach(el => W.slide_attive[el.dataset.c] = el.checked);
}
edb.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  readEd(); const i = +b.dataset.i, L = W.specialisti;
  if (b.dataset.a === 'add') L.push({ specialita: '', medico: 'Dott. ', date: '' });
  if (b.dataset.a === 'del') L.splice(i, 1);
  if (b.dataset.a === 'up' && i > 0) [L[i - 1], L[i]] = [L[i], L[i - 1]];
  if (b.dataset.a === 'down' && i < L.length - 1) [L[i + 1], L[i]] = [L[i], L[i + 1]];
  if (b.dataset.a === 'addor') W.orari.push({ giorni: '', ore: '' });
  if (b.dataset.a === 'delor') W.orari.splice(i, 1);
  drawEd();
});
function openEd() {
  W = JSON.parse(JSON.stringify(D)); let recovered = false;
  if (ONLINE) { try { const s = localStorage.getItem(KEY); if (s) { W = Object.assign(JSON.parse(JSON.stringify(FILE_DATI)), JSON.parse(s)); recovered = true; } } catch (e) {} }
  drawEd();
  if (recovered) edb.insertAdjacentHTML('afterbegin', `<div style="background:#e8f6ec;border:1px solid #9fd3ae;border-radius:8px;padding:12px 14px;line-height:1.4;margin-bottom:10px">
    Ho ritrovato le modifiche salvate in precedenza in questo browser e le ho caricate qui sotto. Controllale e clicca <b>Scarica sala-dati.json</b>.</div>`);
  if (ONLINE) edb.insertAdjacentHTML('afterbegin', `<div style="background:#fff6e0;border:1px solid #f0d58a;border-radius:8px;padding:12px 14px;line-height:1.4">
    <b>Pagina pubblicata sul sito.</b> Le modifiche fatte qui non arrivano da sole ai televisori.<br>
    Al termine clicca <b>Scarica sala-dati.json</b> e carica quel file sul sito, nella stessa cartella di <b>${esc(PAGE_NAME)}</b>, sostituendo il precedente.
    Le TV si aggiornano entro 2 minuti.</div>`); ed.classList.add('open'); document.body.classList.remove('hidecursor'); clearTimeout(timer); msg.textContent = ''; }
function closeEd() { ed.classList.remove('open'); show(idx); }
document.getElementById('ed-close').onclick = closeEd;
const dlBlob = (text, name, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); };
document.getElementById('ed-save').onclick = () => {
  readEd(); D = JSON.parse(JSON.stringify(W));
  if (ONLINE) {
    dlBlob(JSON.stringify(D, null, 2), 'sala-dati.json', 'application/json');
    try { localStorage.removeItem(KEY); } catch (e) {}
    render(); clearTimeout(timer);
    msg.textContent = 'Scaricato ✓ Ora carica sala-dati.json sul sito';
    return;
  }
  let ok = true; try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { ok = false; }
  render(); clearTimeout(timer);
  msg.textContent = ok ? 'Salvato ✓' : 'Applicato (non salvato: usa "Scarica file aggiornato")';
};
document.getElementById('ed-dl').onclick = () => {
  readEd(); D = JSON.parse(JSON.stringify(W)); render(); clearTimeout(timer);
  const html = SRC.replace(/\/\*INIZIO-DATI\*\/[\s\S]*?\/\*FINE-DATI\*\//, '/*INIZIO-DATI*/\nwindow.DATI = ' + JSON.stringify(D, null, 2) + ';\n/*FINE-DATI*/');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = ONLINE ? PAGE_NAME : 'CDL_sala_attesa.html'; a.click();
  msg.textContent = 'File scaricato ✓';
};
document.getElementById('ed-reset').onclick = () => {
  try { localStorage.removeItem(KEY); } catch (e) {}
  W = JSON.parse(JSON.stringify(FILE_DATI)); D = JSON.parse(JSON.stringify(FILE_DATI)); lastJSON = ''; drawEd(); render(); clearTimeout(timer);
  msg.textContent = 'Ripristinato ✓';
};

if (ONLINE) document.getElementById('ed-save').textContent = 'Scarica sala-dati.json';
fit(); render();
if (ONLINE) { pullData(true); setInterval(pullData, 120000); }
</script>
